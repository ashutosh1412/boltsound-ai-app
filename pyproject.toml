[project]
name = "boltsound-ai-app"
version = "0.1.0"
description = "A simple, real AI support assistant built step by step (AI Engineering Simplified, Episode 9)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
